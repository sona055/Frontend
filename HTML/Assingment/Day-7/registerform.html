<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register form</title>
</head>
<body>
    <h1>Registration Form</h1>
    <form>
    <label for="name">Full Name:</label>
    <input type="text" id="name" name="name" placeholder="enter your name">
    <br><br>
    <label for="email">Email:</label>
    <input type="email" id="email" name="email" placeholder="enter your email">
    <br><br>
    <label for="phone">Phone Number:</label>
    <input type="tel" id="phone" name="phone" placeholder="enter number">
    <br><br>
    <label for="dob">Date of Birth:</label>
    <input type="date" id="dob" name="dob">
    <br><br>
    <label>Gender:</label>
    <input type="radio" id="male" name="gender" value="male">
    <label for="male">Male</label>
    <input type="radio" id="female" name="gender" value="female">
    <label for="female">Female</label>
    <br><br>
    <label for="course">Select Course:</label>
    <select id="course" name="course">
        <option value="">Select Course</option>
        <option value="fullstack">Full Stack Development</option>
        <option value="java">Java Programming</option>
        <option value="python">Python Programming</option>
        <option value="web">Web Development</option>
        <option value="data">Data Analytics</option>
    </select>
<br><br>
<label for="skill">  skills</label><br>
<input type="checkbox" id="skill" name="skill">Html <br>
<input type="checkbox" id="skill" name="skill">css <br>
<input type="checkbox" id="skill" name="skill">js <br>
<input type="checkbox" id="skill" name="skill">java <br>
<input type="checkbox" id="skill" name="skill">python <br>
    <br><br>

    <label for="address">Address:</label> <br>
    <textarea id="address" name="address" placeholder="enter address"></textarea>
    <br><br>
    <label for="qualification">Qualification:</label>
    <input type="text" id="qualification" name="qualification" placeholder="qualification">

    <br><br>

    <button type="submit">Submit Application</button>
    <button type="reset">Reset</button>

</form>
</body>
</html>
