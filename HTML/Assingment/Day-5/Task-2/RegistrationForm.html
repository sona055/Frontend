<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
</head>
<body>
    <h1>Student Registration Form</h1>
    <form >
        <label for="name">Name :</label>
        <input type="text" id="name" placeholder="enter name">
        <br><br>
        <label for="email">Email:</label>
        <input type="email" placeholder="enter email id">
        <br><br>
        <label for="password">Password:</label>
        <input type="password" name="" id="password" placeholder="enter password">
        <br><br>
        <label for="age">Age :</label>
        <input type="number" id="age" placeholder=" enter age">
        <br><br>
        <label for="date">Date of Birth:</label>
        <input type="date">
        <br><br>
        <label for="gender">Gender:</label>
        <input type="radio" name="gender" value="male" >male
        <input type="radio" name="gender" value="female">female
        <br><br>
        <label for="course">course:</label>
        <select name="course" id=""> 
            <option value="course">FullStack</option>
            <option value="">Java</option>
            <option value="">Python</option>
           
        </select> <br><br>
        <label for="skill">Skills:</label>
    <input type="checkbox" id="html" name:skill>Html 
    <input type="checkbox" id="css" name="skill">css
    <input type="checkbox" id="js" name="skill">js
    <input type="checkbox" id="java" name="skill">java
    <input type="checkbox" id="python" name="skill">python
    <br><br>
    <label for="">Enter Address:</label> <br>
    <textarea name="" id="" placeholder="enter address"></textarea>
    <br><br>
    <label for="">submit</label>
    <button>Submit</button><br><br>
    <label for="">Reset</label>
    <button>Reset</button>
    </form>
</body>
</html>
